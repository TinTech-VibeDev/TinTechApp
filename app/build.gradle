plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.tintech.film'
    compileSdk 36

    defaultConfig {
        applicationId "ir.tintech.film"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.2.0"
        buildConfigField "String", "APP_BASE_URL", "\"https://movie-search-bot.barmonn.workers.dev/menu\""
    }

    def releaseStore = System.getenv("ANDROID_KEYSTORE_PATH")
    def releaseAlias = System.getenv("ANDROID_KEY_ALIAS")
    def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
    def hasReleaseSigning = releaseStore && releaseAlias && releaseStorePassword && releaseKeyPassword

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.media3:media3-exoplayer:1.10.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.0'
    implementation 'androidx.media3:media3-ui:1.10.0'
}
