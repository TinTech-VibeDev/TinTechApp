name: Build FilmBuff Mobile Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: filmbuff-mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      APP_FALLBACK_URLS: ${{ vars.APP_FALLBACK_URLS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare signing
        if: github.event_name != 'pull_request'
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 || vars.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD || vars.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || vars.KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || vars.KEY_PASSWORD || vars.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          for name in ('KEYSTORE_B64', 'STORE_PASSWORD', 'KEY_ALIAS_VALUE', 'KEY_PASSWORD_VALUE'):
              value = os.environ.get(name, '')
              if value:
                  value = value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::add-mask::' + value)
          PY
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS_VALUE:-}" ] || [ -z "${KEY_PASSWORD_VALUE:-}" ]; then
            echo '::error::Existing signing configuration is incomplete. Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Secrets or Variables. No Debug APK will be published.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/filmbuff-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/filmbuff-release.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS_VALUE" >/dev/null
      - name: Test and lint Mobile
        run: |
          chmod +x gradlew
          ./gradlew testMobileDebugUnitTest lintMobileDebug --no-daemon
      - name: Build signed Mobile
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/filmbuff-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD || vars.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || vars.KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || vars.KEY_PASSWORD || vars.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleMobileRelease bundleMobileRelease --no-daemon
      - name: Verify Release APKs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sdk_tools="$ANDROID_HOME/build-tools/36.0.0"
          for variant in mobile; do
            apk="app/build/outputs/apk/$variant/release/app-$variant-release.apk"
            "$sdk_tools/apksigner" verify --verbose --min-sdk-version 24 "$apk"
            "$sdk_tools/zipalign" -c -P 16 4 "$apk"
            "$sdk_tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/$variant-badging.txt"
            if grep -q '^application-debuggable' "$RUNNER_TEMP/$variant-badging.txt"; then
              echo '::error::A debuggable APK cannot be published as Release.'
              exit 1
            fi
          done
      - name: Upload Mobile
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: FilmBuff-Mobile-1.3.0-Release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/mobile/release/app-mobile-release.apk
            app/build/outputs/bundle/mobileRelease/*.aab
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FilmBuff-Mobile-checks
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/filmbuff-release.jks"
