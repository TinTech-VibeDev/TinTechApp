name: FilmBuff TV signed Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      APP_FALLBACK_URLS: ${{ vars.APP_FALLBACK_URLS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -f "$ANDROID_HOME/platforms/android-36/android.jar" ] || missing+=("platforms;android-36")
          [ -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ] || missing+=("build-tools;36.0.0")
          if [ "${#missing[@]}" -gt 0 ]; then
            sdk_manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
            if [ -z "$sdk_manager" ] || [ ! -x "$sdk_manager" ]; then
              echo '::error::Android SDK manager is unavailable on this runner.'
              exit 1
            fi
            "$sdk_manager" --sdk_root="$ANDROID_HOME" --install "${missing[@]}" < <(yes)
          fi
      - name: Decode existing release key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 || vars.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD || vars.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || vars.KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || vars.KEY_PASSWORD || vars.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS_VALUE" ] || [ -z "$KEY_PASSWORD_VALUE" ]; then
            echo '::error::Signing secrets/variables are incomplete: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/filmbuff-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/filmbuff-release.jks" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS_VALUE" >/dev/null
      - name: Build signed Release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/filmbuff-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD || vars.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || vars.KEY_ALIAS || vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || vars.KEY_PASSWORD || vars.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmBuff-TV-1.3.1-Release
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release.apk
      - name: Delete temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/filmbuff-release.jks"
