name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepare icons
        shell: bash
        run: |
          mkdir -p build
          [ -f build/icon.ico ] || cp assets/icon.ico build/icon.ico
          [ -f build/icon.png ] || cp assets/icon.png build/icon.png || true
      - name: Install
        run: npm install
        env:
          NODE_ENV: development
      - name: Build installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FilmBuff-Setup
          path: dist/*.exe
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
